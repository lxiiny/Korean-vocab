<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>신원韩语词斩</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#7b8497;--line:#e8ebf2;--accent:#ff7a45;--accent2:#ffb067;--good:#20a66a;--bad:#e24a4a;--shadow:0 14px 38px rgba(36,44,70,.10)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 92px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}.brand{font-weight:900;font-size:22px}.brand b{color:var(--accent)}.pill{font-size:12px;background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:99px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#fff 0%,#fff7f1 100%)} .hero h1{font-size:28px;margin:0 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.stat{background:#f8f9fc;border-radius:16px;padding:12px 8px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:var(--accent);color:white}.ghost{background:#f3f5f9;color:var(--ink)}.good{background:#eaf8f1;color:var(--good)}.mid{background:#fff4e8;color:#c86c14}.bad{background:#fff0f0;color:var(--bad)}
.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:14px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.tabs>div{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.tab{border:0;background:none;padding:8px 4px;color:#8a92a4;font-size:12px}.tab.active{color:var(--accent);font-weight:800}.tab i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.view{display:none}.view.active{display:block}
.flash{min-height:430px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}.meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;border-radius:99px;background:#f1f3f7;color:#697184}
.icon{font-size:70px;margin:20px 0 6px}.word{font-size:42px;font-weight:900;letter-spacing:-1px}.meaning{font-size:22px;font-weight:800;margin-top:8px}.hiddenMeaning{filter:blur(9px);user-select:none}.sub{color:var(--muted);font-size:14px;margin-top:10px}.example{background:#f8f9fc;border-radius:16px;padding:14px;margin-top:14px;text-align:left;line-height:1.65}.example small{color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.speak{width:46px;height:46px;border-radius:50%;border:0;background:#fff3ea;font-size:21px;cursor:pointer;margin:10px auto}
.progress{height:8px;background:#eceff5;border-radius:99px;overflow:hidden;margin:8px 0 14px}.progress span{display:block;height:100%;background:var(--accent);width:0}
.listhead{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;background:white}
select{border:1px solid var(--line);border-radius:14px;padding:10px;background:white}.wordrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}.wordrow .wi{font-size:28px;width:42px;text-align:center}.wordrow .grow{flex:1}.wordrow b{font-size:18px}.wordrow small{display:block;color:var(--muted);margin-top:3px}.master{font-size:12px;color:var(--good)}
.quizq{text-align:center;padding:24px 4px}.quizq .big{font-size:38px;font-weight:900}.options{display:grid;gap:9px}.option{border:1px solid var(--line);background:white;border-radius:16px;padding:15px;text-align:left;font-size:15px}.option.correct{border-color:var(--good);background:#eaf8f1}.option.wrong{border-color:var(--bad);background:#fff0f0}
.formgrid{display:grid;gap:10px}.formgrid input,.formgrid textarea,.formgrid select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:white}.formgrid textarea{min-height:74px}
.sectionTitle{font-size:18px;font-weight:900;margin:6px 0 12px}.tiny{font-size:12px;color:var(--muted);line-height:1.5}.danger{color:var(--bad)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.word{font-size:36px}.flash{min-height:410px}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div class="brand"><b>신원</b>韩语词斩</div><div class="pill" id="today"></div></div>

 <section id="home" class="view active">
  <div class="panel hero">
   <h1>오늘도 화이팅!</h1>
   <p>你的首尔大韩语私人词库。教材词、老师扩展词、易错变形放在一起循环复习。</p>
   <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>总词汇</span></div>
    <div class="stat"><b id="sMaster">0</b><span>已掌握</span></div>
    <div class="stat"><b id="sReview">0</b><span>待复习</span></div>
    <div class="stat"><b id="sStreak">1</b><span>连续天数</span></div>
   </div>
   <div class="actions"><button class="btn primary" onclick="startStudy()">开始今日背词</button><button class="btn ghost" onclick="go('quiz')">四选一测试</button></div>
  </div>
  <div class="panel">
   <div class="sectionTitle">词库</div>
   <div id="deckSummary"></div>
  </div>
  <div class="panel">
   <div class="sectionTitle">学习规则</div>
   <div class="tiny">不认识：1分钟后优先再现　·　模糊：提高复习频率　·　认识：逐步拉长间隔。数据保存在当前浏览器；可在“管理”里导出 JSON 备份。</div>
  </div>
 </section>

 <section id="study" class="view">
  <div class="progress"><span id="prog"></span></div>
  <div class="panel flash">
   <div>
    <div class="meta" id="meta"></div>
    <div class="icon" id="fIcon">📚</div>
    <div class="word" id="fWord"></div>
    <button class="speak" onclick="speakCurrent()">🔊</button>
    <div id="answerArea">
      <div class="meaning hiddenMeaning" id="fMeaning"></div>
      <div class="sub">先回忆意思，再点击显示答案</div>
      <button class="btn primary" style="margin-top:18px" onclick="reveal()">显示答案</button>
    </div>
    <div id="detailArea" style="display:none">
      <div class="meaning" id="fMeaning2"></div>
      <div class="sub" id="fForm"></div>
      <div class="example"><b id="fEx"></b><br><small id="fExZh"></small></div>
    </div>
   </div>
   <div class="rate" id="rate" style="display:none">
    <button class="btn bad" onclick="rate(0)">不认识</button>
    <button class="btn mid" onclick="rate(1)">模糊</button>
    <button class="btn good" onclick="rate(2)">认识</button>
   </div>
  </div>
 </section>

 <section id="quiz" class="view">
  <div class="panel">
   <div class="sectionTitle">四选一 · 中韩识别</div>
   <div class="quizq"><div class="big" id="qWord"></div><div class="sub">选择正确的中文意思</div></div>
   <div class="options" id="options"></div>
   <button id="nextQ" class="btn primary" style="width:100%;margin-top:14px;display:none" onclick="newQuiz()">下一题</button>
  </div>
 </section>

 <section id="words" class="view">
  <div class="panel">
   <div class="sectionTitle">全部词汇</div>
   <div class="listhead"><input id="search" class="search" placeholder="搜索韩语 / 中文…" oninput="renderWords()"><select id="deckFilter" onchange="renderWords()"></select></div>
   <div id="wordList"></div>
  </div>
 </section>

 <section id="manage" class="view">
  <div class="panel">
   <div class="sectionTitle">添加新词</div>
   <div class="formgrid">
    <input id="aKo" placeholder="韩语，例如：기다리다">
    <input id="aZh" placeholder="中文，例如：等待">
    <select id="aPos"><option>名词</option><option>动词</option><option>形容词</option><option>副词</option><option>表达</option><option>连接副词</option><option>量词</option></select>
    <input id="aBook" placeholder="词库，例如：首尔大2A / 老师扩展">
    <input id="aForm" placeholder="变形，例如：기다리다 → 기다려요 → 기다렸어요">
    <input id="aEx" placeholder="韩语例句">
    <input id="aExZh" placeholder="中文例句">
    <button class="btn primary" onclick="addWord()">加入词库</button>
   </div>
  </div>
  <div class="panel">
   <div class="sectionTitle">词库备份</div>
   <div class="actions"><button class="btn ghost" onclick="exportData()">导出 JSON</button><label class="btn ghost" style="text-align:center">导入 JSON<input type="file" accept=".json" onchange="importData(event)" hidden></label></div>
   <p class="tiny">以后继续学 1B、2A、2B 时，可以持续往这个数据库追加，不需要重做网站。</p>
   <button class="btn ghost danger" style="width:100%;margin-top:8px" onclick="resetProgress()">只重置学习进度</button>
  </div>
 </section>
</div>

<div class="tabs"><div>
<button class="tab active" data-v="home" onclick="go('home')"><i>⌂</i>首页</button>
<button class="tab" data-v="study" onclick="startStudy()"><i>▣</i>背词</button>
<button class="tab" data-v="words" onclick="go('words')"><i>☷</i>词库</button>
<button class="tab" data-v="manage" onclick="go('manage')"><i>＋</i>管理</button>
</div></div>

function save(){localStorage.setItem('sw_words',JSON.stringify(words));localStorage.setItem('sw_progress',JSON.stringify(progress))}
function key(w){return w.ko+'|'+w.book}

}
function startStudy(){

}

}
function reveal(){answerArea.style.display='none';detailArea.style.display='block';rate.style.display='grid'}
function rate(r){
 const k=key(current), p=progress[k]||{seen:0,level:0,wrong:0}; p.seen++;
 if(r===0){p.level=Math.max(0,p.level-1);p.wrong++;queue.splice(Math.min(qi+3,queue.length),0,current)}

}
function speakCurrent(){ if(!current)return; const u=new SpeechSynthesisUtterance(current.ko);u.lang='ko-KR';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}

function addWord(){

function importData(e){
