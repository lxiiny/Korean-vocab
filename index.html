const DAY_NEW=20, VERSION=3; const today=()=>new Date().toISOString().slice(0,10); const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
let oldProgress=JSON.parse(localStorage.getItem('sw_progress')||'{}'); let state=JSON.parse(localStorage.getItem('sw_v2_state')||'null')||{xp:0,streak:0,lastDay:'',daily:{},cards:{}};
function k(w){return w.ko+'|'+w.book} function card(w){let c=state.cards[k(w)]||{};let old=oldProgress[k(w)]||{};return state.cards[k(w)]={level:c.level??old.level??0,seen:c.seen??old.seen??0,correct:c.correct??old.correct??0,wrong:c.wrong??old.wrong??0,last:c.last||'',due:c.due||'',introduced:c.introduced||false}}
seed.forEach(card); function save(){localStorage.setItem('sw_v2_state',JSON.stringify(state));localStorage.setItem('sw_progress',JSON.stringify(Object.fromEntries(seed.map(w=>[k(w),state.cards[k(w)]]))))}
function ensureDay(){let d=today(); if(!state.daily[d]){let due=seed.filter(w=>{let c=card(w);return c.introduced&&c.due&&c.due<=d});let fresh=seed.filter(w=>!card(w).introduced).slice(0,DAY_NEW);state.daily[d]={newKeys:fresh.map(k),reviewKeys:due.map(k),doneNew:[],doneReview:[],xp0:state.xp};} if(state.lastDay!==d){if(state.lastDay===addDays(d,-1))state.streak=(state.streak||0)+1;else if(!state.lastDay)state.streak=1;else state.streak=1;state.lastDay=d;}save();return state.daily[d]}
function bykey(x){return seed.find(w=>k(w)===x)} function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='home')renderHome();if(v==='words')renderWords();window.scrollTo(0,0)}
function renderHome(){let d=ensureDay(),dn=d.doneNew.length,dr=d.doneReview.length;newStat.textContent=dn+'/'+d.newKeys.length;reviewStat.textContent=dr+'/'+d.reviewKeys.length;xpStat.textContent=state.xp;streak.textContent='连续 '+state.streak+' 天';let total=d.newKeys.length+d.reviewKeys.length,done=dn+dr,p=total?Math.round(done/total*100):100;dayBar.style.width=p+'%';dayText.textContent=done+'/'+total+' 个任务 · '+p+'%';let mastered=seed.filter(w=>card(w).level>=4).length;garden.textContent=mastered<10?'🌱':mastered<30?'🌷🌱':mastered<60?'🌷🌼🌿':'🌸🌷🌼🦋';datePill.textContent=new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});greeting.textContent=dr<d.reviewKeys.length?'先把旧朋友复习一下，再认识今天的新词。':'今天的20个新朋友在等你。'}
let queue=[],qi=0,current=null,currentPhase='new';
function startDaily(){let d=ensureDay();let rev=d.reviewKeys.filter(x=>!d.doneReview.includes(x));let nw=d.newKeys.filter(x=>!d.doneNew.includes(x));queue=[...rev.map(x=>({key:x,phase:'review'})),...nw.map(x=>({key:x,phase:'new'}))];qi=0;if(!queue.length){finishDay();return}go('study');showCard()}
function showCard(){let item=queue[qi];if(!item){finishDay();return}current=bykey(item.key);currentPhase=item.phase;phaseBadge.textContent=item.phase==='review'?'♡ 今日复习':'✦ 今日新词';counter.textContent=(qi+1)+' / '+queue.length;icon.textContent=current.icon||'🎀';ko.textContent=current.ko;zh.textContent=current.zh;detail.innerHTML=(current.form?'<b>'+current.form+'</b><br>':'')+(current.ex||'')+(current.exzh?'<br><span class="tiny">'+current.exzh+'</span>':'');answer.classList.add('hide');revealBtn.classList.remove('hide')}
function reveal(){answer.classList.remove('hide');revealBtn.classList.add('hide')}
function rateCard(r){let c=card(current),d=ensureDay();c.seen++;c.introduced=true;c.last=today();if(r===2){c.correct++;c.level=Math.min(5,c.level+1);state.xp+=5}else if(r===1){c.level=Math.max(1,c.level);state.xp+=2}else{c.wrong++;c.level=Math.max(0,c.level-1);state.xp+=1;queue.push({key:k(current),phase:'review'})}let gaps=[1,1,2,4,7,14];c.due=addDays(today(),gaps[c.level]||1);let arr=currentPhase==='new'?d.doneNew:d.doneReview;if(!arr.includes(k(current)))arr.push(k(current));save();qi++;showCard()}
function speakCurrent(){if(!current)return;let u=new SpeechSynthesisUtterance(current.ko);u.lang='ko-KR';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function finishDay(){let d=ensureDay();rnew.textContent=d.doneNew.length;rreview.textContent=d.doneReview.length;rxp.textContent='+'+(state.xp-d.xp0);let rewards=['🎀 获得：蝴蝶结贴纸','☁️ 获得：云朵贴纸','🌷 获得：小花贴纸','⭐ 获得：星星贴纸','🐰 学习搭子今天很开心！'];reward.textContent=rewards[(new Date().getDate())%rewards.length];go('result')}
let quiz=[],qidx=0,qcur=null;function studyPool(){let intro=seed.filter(w=>card(w).introduced);return intro.length>=4?intro:seed.slice(0,Math.min(40,seed.length))}function startQuiz(){quiz=shuffle(studyPool()).slice(0,10);qidx=0;go('quiz');newQuiz()}function newQuiz(){qcur=quiz[qidx];if(!qcur){go('home');return}qko.textContent=qcur.ko;qopts.innerHTML='';let opts=shuffle([qcur,...shuffle(seed.filter(w=>w!==qcur)).slice(0,3)]);opts.forEach(w=>{let b=document.createElement('button');b.className='option';b.textContent=w.zh;b.onclick=()=>answerQuiz(b,w===qcur);qopts.appendChild(b)});qnext.classList.add('hide')}function answerQuiz(b,ok){[...qopts.children].forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');let c=card(qcur);if(ok){c.correct++;c.level=Math.min(5,c.level+1);state.xp+=3}else{c.wrong++;c.level=Math.max(0,c.level-1);state.xp+=1}save();qnext.classList.remove('hide')}function nextQuiz(){qidx++;newQuiz()}
let spells=[],sidx=0,scur=null;function startSpell(){spells=shuffle(studyPool()).slice(0,10);sidx=0;go('spell');newSpell()}function newSpell(){scur=spells[sidx];if(!scur){go('home');return}spellZh.textContent=scur.zh;spellInput.value='';spellFeedback.classList.add('hide');spellNext.classList.add('hide');spellInput.disabled=false}function checkSpell(){let ans=spellInput.value.trim().replace(/\s+/g,' '),ok=ans===scur.ko;let c=card(scur);spellFeedback.classList.remove('hide');spellFeedback.innerHTML=ok?'🎉 <b>拼对了！</b> +5 XP':'🌷 再记一次：<b>'+scur.ko+'</b>';if(ok){c.correct++;c.level=Math.min(5,c.level+1);state.xp+=5}else{c.wrong++;c.level=Math.max(0,c.level-1);c.due=today();state.xp+=1}save();spellInput.disabled=true;spellNext.classList.remove('hide')}function nextSpell(){sidx++;newSpell()}
function renderWords(){let f=filter.value,s=(search.value||'').toLowerCase();let arr=seed.filter(w=>{let c=card(w);let ok=f==='all'||(f==='new'&&!c.introduced)||(f==='weak'&&(c.wrong>c.correct||c.level<=1&&c.introduced))||(f==='master'&&c.level>=4);return ok&&(w.ko.toLowerCase().includes(s)||w.zh.includes(s))});wordCount.textContent=seed.length+' 词 · 当前显示 '+arr.length;wordList.innerHTML=arr.map(w=>{let c=card(w);return '<div class="wordrow"><div class="row"><div><b>'+w.ko+'</b>　'+w.zh+'<div class="tiny">'+w.book+' · '+w.pos+(w.form?' · '+w.form:'')+'</div></div><span class="badge">'+['未学习','刚接触','初识','熟悉','已掌握','很熟练'][c.level]+'</span></div></div>'}).join('')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}ensureDay();renderHome();
</script></body></html>
